<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      <app-explore-container name="Settings"></app-explore-container>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Settings</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content color="light">
    <ion-list-header class="custom-list-header">Appearance</ion-list-header>
    <ion-list [inset]="true">
      <ion-item>
        <ion-toggle [(ngModel)]="darkPaletteToggle" (ionChange)="darkPaletteToggleChange($event)" justify="space-between">Dark Mode</ion-toggle>
      </ion-item>
      <ion-item>
        <ion-toggle
          [(ngModel)]="highContrastPaletteToggle"
          (ionChange)="highContrastPaletteToggleChange($event)"
          justify="space-between">High Contrast Mode</ion-toggle>
      </ion-item>
    </ion-list>
    <ion-list-header class="custom-list-header">Motors Speed</ion-list-header>
    <ion-list [inset]="true">
      <ion-item>
        <ion-range [ticks]="true" [snaps]="true" [min]="0" [max]="10" [(ngModel)]="motorsSpeed" (ionChange)="onSpeedChange()">
          <ion-icon size="small" name="speedometer-outline" slot="start"></ion-icon>
          <ion-icon name="speedometer" slot="end"></ion-icon>
        </ion-range>
      </ion-item>
    </ion-list>
    <ion-list-header class="custom-list-header">WiFi</ion-list-header>
    <ion-list [inset]="true">
      <ion-item>
        <ion-label position="stacked">SSID</ion-label>
        <ion-input [(ngModel)]="boatSSID" placeholder="Enter Boat SSID" maxlength="32"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Password</ion-label>
        <ion-input [(ngModel)]="boatPassword" type="password" placeholder="Enter Boat Password" maxlength="32"></ion-input>
      </ion-item>
      <ion-item>
        <ion-button class="button" expand="full" (click)="saveSettings()">Save</ion-button>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-content>
