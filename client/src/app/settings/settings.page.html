<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      <app-explore-container name="Settings"></app-explore-container>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Settings</ion-title>
    </ion-toolbar>
  </ion-header>
  <div class="center-container">
    <ion-label>Motors Speed</ion-label>
    <ion-range class="speed-range" [pin]="true" [pinFormatter]="pinFormatter" [ticks]="true" [snaps]="true" [min]="0" [max]="10" [(ngModel)]="motorsSpeed" (ionChange)="onSpeedChange()">
      <ion-icon size="small" slot="start" name="speedometer"></ion-icon>
      <ion-icon slot="end" name="speedometer"></ion-icon>
    </ion-range>
  </div>
</ion-content>
