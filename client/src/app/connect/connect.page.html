<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      <app-explore-container name="Connect"></app-explore-container>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Connect</ion-title>
    </ion-toolbar>
  </ion-header>
  <div class="center-container">
    <img src="assets/logo.png" alt="Logo" class="logo">
    <ion-button class="button" [disabled]="isConnecting" (click)="connectToHotspot()">Connect to Boat</ion-button>
    <ion-button class="button" fill="outline" [disabled]="isTesting" (click)="testConnection()">Test Connection</ion-button>
  </div>
</ion-content>
